# NOX Exit Node Configuration - Arbitrum Sepolia
#
# Exit nodes execute protocol-neutral paid transactions.
# They require an ETH wallet funded with gas and a price oracle for profitability.
#
# Setup:
#   1. Copy this file: cp configs/exit.toml config.toml
#   2. Private keys are loaded from .env (generate with `nox keygen`)
#   3. Fund your ETH wallet with Arb Sepolia ETH (see REGISTRATION.md)
#
# Deployment: 2026-09-25 (configs/arbitrum-sepolia.deployment.json). The April
# 2026 registry 0x8626aF80db409BeD3C19871FAdf9b0Ce7Aa641Bc is retired.

# --- Core ---

# Ethereum RPC -used for topology sync, paid-execution simulation AND
# transaction submission. It MUST support eth_simulateV1: without it every paid
# transaction is rejected. https://sepolia-rollup.arbitrum.io/rpc does NOT
# (it returns -32603 "method handler crashed"); publicnode does.
eth_rpc_url = "https://arbitrum-sepolia-rpc.publicnode.com"

# Chain ID: 421614 = Arbitrum Sepolia
chain_id = 421614

# Node role: "exit" = executes on-chain transactions
node_role = "exit"

# Price oracle sidecar (runs alongside nox via docker-compose)
# Required for exit nodes -used for gas profitability calculations
oracle_url = "http://127.0.0.1:15004"

# --- Contract Addresses ---

# NoxRegistry (UUPS proxy): node registration, topology, staking
registry_contract_address = "0xF7BFf88A1412054a001Dc4b8aCBddAd6F9b26cB6"

# NoxRewardPool (UUPS proxy)
nox_reward_pool_address = "0xA487BAa4f2C3fAA01C70066EE88b6F7fD6f1361D"

# NoxEntryPoint (EIP-712 verifyingContract for execution quotes)
nox_entry_point_address = "0xad911Ca217C6dC779fCE6A6538bDda3071c38E7E"

# --- Keys (loaded from .env via environment variables) ---
# Generate with the same immutable image digest used by Docker Compose.
routing_private_key = ""
p2p_private_key = ""
eth_wallet_private_key = ""

# --- Economics ---

# Minimum ETH balance before warning (wei). Default: 0.01 ETH.
# Exit nodes spend gas submitting transactions. Monitor this threshold.
min_gas_balance = "10000000000000000"

# Minimum profit margin (%) to execute a transaction.
# If gas_cost * 1.10 > revenue, the TX is dropped as unprofitable.
min_profit_margin_percent = 10
oracle_cache_ttl_secs = 10
oracle_max_observation_age_secs = 300
oracle_max_future_skew_secs = 30
native_asset_price_id = "ethereum"
native_asset_decimals = 18
gas_limit_buffer_bps = 2000
initial_fee_buffer_bps = 2000
replacement_step_bps = 2000
chain_data_fee_mode = "rpc_gas_estimate_includes_data_fee"
quote_ttl_secs = 30
quote_network_fee_bps = 500
quote_maximum_transaction_gas = 20000000
quote_max_outstanding = 256
quote_max_pending_sponsored_gas = 500000000
quote_rolling_loss_limit_native = "100000000000000000"
quote_rolling_loss_window_secs = 3600

# --- Networking ---

# libp2p P2P port -MUST be publicly reachable (open TCP in firewall)
p2p_port = 15000
p2p_listen_addr = "0.0.0.0"

# P2P identity persistence (inside Docker volume)
p2p_identity_path = "/var/lib/nox/identity/p2p_id.key"

# Metrics/topology API. MUST be p2p_port + 1 and reachable from the internet:
# the Hisoka indexer derives it from your registered multiaddr (tcp port + 1)
# and probes /topology and /metrics/json. A node it cannot reach is published
# as offline and clients will not route through it. The port is read-only.
metrics_port = 15001

# HTTP ingress -exit nodes typically don't accept client packets directly
ingress_port = 0

# Topology API -set to 15003 to serve as a seed node, 0 to disable
topology_api_port = 0

# Topology bootstrap. Leave empty: the node replays the registry from
# chain_start_block, which takes only a few eth_getLogs calls.
bootstrap_topology_urls = []

# --- Relay Pipeline ---

min_pow_difficulty = 3
db_path = "/var/lib/nox/data/db"
benchmark_mode = false
block_poll_interval_secs = 5
# Registry deployment block (meta.startBlock in the deployment manifest).
chain_start_block = 312414608
max_broadcast_tx_size = 262144
response_prune_interval_secs = 60

# --- [http] HTTP Proxy (Exit Node) ---

[http]
# SSRF protection -NEVER set allow_private_ips = true in production
allow_private_ips = false
request_timeout_secs = 120
max_response_bytes = 134217728  # 128 MB max response body

# --- [network] P2P Settings ---

[network]
max_connections = 500
max_connections_per_peer = 10
ping_interval_secs = 15
idle_connection_timeout_secs = 3600

[network.rate_limit]
burst_unknown = 500
rate_unknown = 1000
burst_trusted = 1000
rate_trusted = 2000

# --- [relayer] Sphinx Relay Pipeline ---

[relayer]
queue_size = 10000
worker_count = 2
mix_delay_ms = 200.0
cover_traffic_rate = 0.02
drop_traffic_rate = 0.02
replay_window = 3600
bloom_capacity = 100000

[relayer.fragmentation]
timeout_seconds = 300
prune_interval_seconds = 60

# --- Token Registry (Profitability Engine) ---
# One [[tokens]] entry per deployment feeAssets entry; preflight requires an
# exact match. SOKA is the testnet fee asset. The bundled price server only
# serves "ethereum", "usd-coin" and "bitcoin", so SOKA is valued through the
# "usd-coin" feed (1 SOKA = 1 USD). decimals must match SOKA.decimals() on chain.

[[tokens]]
address = "0x0F69cf1c9F4FF72471701036dd789c934458e630"
symbol = "SOKA"
decimals = 18
price_id = "usd-coin"

# HowlPaymentAdapter, paid in the deployment's fee assets.
[[payment_adapters]]
address = "0xfC874B702F8D59B60B35582855505F4f60cE766D"
fee_assets = ["0x0F69cf1c9F4FF72471701036dd789c934458e630"]
maximum_payment_gas = 4000000
