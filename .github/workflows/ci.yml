name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: a contract upgrade makes the live preflight fail until the
    # manifest is regenerated (see "After a Contract Upgrade" in README.md).
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Preflight tests and Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Preflight tests
        run: bash scripts/test-preflight.sh
      - name: Compose resolves for relays, exits and the KPS entry
        run: |
          touch .env config.toml deployment.json nox-kps.toml nox-kps-bridge.toml
          export NOX_IMAGE="$(jq -r .release.noxImage configs/arbitrum-sepolia.deployment.json)"
          export NOX_PREFLIGHT_IMAGE="$(jq -r .release.preflightImage configs/arbitrum-sepolia.deployment.json)"
          relay="$(docker compose config --services | sort | tr '\n' ' ')"
          exit_services="$(docker compose --profile exit config --services | sort | tr '\n' ' ')"
          kps="$(docker compose --profile exit --profile kps config --services | sort | tr '\n' ' ')"
          kps_admin="$(docker compose --profile kps-admin config --services | sort | tr '\n' ' ')"
          bridge="$(docker compose --profile kps-bridge config --services | sort | tr '\n' ' ')"
          bridge_admin="$(docker compose --profile kps-bridge-admin config --services | sort | tr '\n' ' ')"
          echo "relay: $relay"
          echo "exit: $exit_services"
          echo "kps: $kps"
          echo "kps-admin: $kps_admin"
          echo "kps-bridge: $bridge"
          echo "kps-bridge-admin: $bridge_admin"
          test "$relay" = "nox preflight "
          test "$exit_services" = "nox preflight price-server "
          test "$kps" = "nox nox-kps nox-kps-init nox-kps-preflight preflight price-server "
          test "$kps_admin" = "nox nox-kps-admin nox-kps-init preflight "
          test "$bridge" = "nox nox-kps-bridge nox-kps-bridge-init nox-kps-bridge-preflight preflight "
          test "$bridge_admin" = "nox nox-kps-bridge-admin nox-kps-bridge-init preflight "
          # The KPS volumes appear only with the profile.
          test "$(docker compose config --volumes | sort | tr '\n' ' ')" = "nox-data nox-identity nox-logs "

  change-ip:
    name: Change-IP tool against anvil and cast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.3.2
      - name: Calldata, argument validation, dry runs and sends
        run: |
          set -o pipefail
          python3 scripts/test_change_ip.py 2>&1 | tee change-ip.log
          ! grep -q 'skipped' change-ip.log

  image:
    name: Keygen and check-config on the pinned image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pull the release image
        run: |
          NOX_IMAGE="$(jq -r .release.noxImage configs/arbitrum-sepolia.deployment.json)"
          echo "NOX_IMAGE=$NOX_IMAGE" >> "$GITHUB_ENV"
          docker pull --quiet "$NOX_IMAGE"
      - name: Documented keygen command produces a complete .env
        run: |
          umask 077
          docker run --rm "$NOX_IMAGE" nox keygen > .env
          test "$(grep -c '^NOX__[A-Z0-9_]*_PRIVATE_KEY=[0-9a-f]\{64\}$' .env)" -eq 3
          test "$(grep -c 'for registration' .env)" -eq 3
      - name: Templates pass check-config with the generated keys
        run: |
          for role in relay exit; do
            output="$(docker run --rm --env-file .env \
              -v "$PWD/configs/$role.toml:/etc/nox/config.toml:ro" \
              "$NOX_IMAGE" nox --config /etc/nox/config.toml check-config)"
            grep -q '^configuration OK$' <<<"$output"
            grep -i "^node_role: $role$" <<<"$output"
          done
      - name: The pinned image ships the recorded nox-kps and accepts the template
        run: |
          NOX_KPS="$(jq -r '.release.noxKps // empty' configs/arbitrum-sepolia.deployment.json)"
          if [ -z "$NOX_KPS" ]; then
            echo "release.noxKps is unset: this release runs without the kps profile"
            exit 0
          fi
          test "$(docker run --rm "$NOX_IMAGE" nox-kps --version)" = "nox-kps $NOX_KPS"
          work="$(mktemp -d)"
          mkdir "$work/keccak"
          chmod 0777 "$work" "$work/keccak"
          sed 's/"203.0.113.10"/"198.51.100.20"/' configs/nox-kps.toml > "$work/nox-kps.toml"
          kps() {
            docker run --rm --user 10002:10002 --network none --entrypoint nox-kps \
              -e NOX_KPS_CONFIG=/etc/nox-kps/config.toml \
              -v "$work/nox-kps.toml:/etc/nox-kps/config.toml:ro" \
              -v "$work:/var/lib/nox-kps" "$NOX_IMAGE" "$@"
          }
          certhash="$(kps init | sed -n 's/^certhash: //p')"
          test -n "$certhash"
          sed -i "s/^expected_certhash = \"\"/expected_certhash = \"$certhash\"/" "$work/nox-kps.toml"
          kps check-config | grep -q '^configuration OK'
          # The bridge template: its own identity, port 15007, admin 15008 and the node's address.
          bridge="$(mktemp -d)"
          mkdir "$bridge/keccak"
          chmod 0777 "$bridge" "$bridge/keccak"
          sed -e 's/"203.0.113.20"/"198.51.100.21"/' \
            -e 's/^node_address = ""/node_address = "0x862D6B1105bdE9d64dC5182fe3CD9d09F6F37463"/' \
            configs/nox-kps-bridge.toml > "$bridge/nox-kps.toml"
          kps_bridge() {
            docker run --rm --user 10002:10002 --network none --entrypoint nox-kps \
              -e NOX_KPS_CONFIG=/etc/nox-kps/config.toml \
              -v "$bridge/nox-kps.toml:/etc/nox-kps/config.toml:ro" \
              -v "$bridge:/var/lib/nox-kps" "$NOX_IMAGE" "$@"
          }
          bridge_certhash="$(kps_bridge init | sed -n 's/^certhash: //p')"
          test -n "$bridge_certhash" && test "$bridge_certhash" != "$certhash"
          sed -i "s/^expected_certhash = \"\"/expected_certhash = \"$bridge_certhash\"/" "$bridge/nox-kps.toml"
          kps_bridge check-config | grep -q '^configuration OK'
          kps_bridge address | grep -qx "address: 198.51.100.21:15007:$bridge_certhash"

  live:
    name: Live preflight against Arbitrum Sepolia
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Relay and exit templates verify against the chain
        env:
          # Fixed test values, never a real node's keys.
          NOX__ROUTING_PRIVATE_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
          NOX__P2P_PRIVATE_KEY: "2222222222222222222222222222222222222222222222222222222222222222"
          NOX__ETH_WALLET_PRIVATE_KEY: "3333333333333333333333333333333333333333333333333333333333333333"
        run: |
          NOX_IMAGE="$(jq -r .release.noxImage configs/arbitrum-sepolia.deployment.json)"
          for role in relay exit; do
            for attempt in 1 2 3; do
              if scripts/preflight.sh "$role" "configs/$role.toml" "$NOX_IMAGE" \
                configs/arbitrum-sepolia.deployment.json; then
                continue 2
              fi
              echo "attempt $attempt failed; retrying" >&2
              sleep 15
            done
            exit 1
          done
