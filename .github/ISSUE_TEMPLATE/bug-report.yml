name: Bug Report
description: Report an issue with your NOX node
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: NOX Image
      description: "The image digest you run (`echo \"$NOX_IMAGE\"`, or `docker inspect --format '{{.Config.Image}}' nox-node`). The version string alone does not identify a release."
      placeholder: "ghcr.io/hisoka-io/nox@sha256:..."
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Node Role
      options:
        - relay
        - exit
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: "Run `docker compose logs --tail 50 nox` and paste output. REDACT any private keys."
      render: text
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration (sanitized)
      description: "Paste your config.toml with private keys removed. Keep contract addresses and network settings."
      render: toml
    validations:
      required: false
