# NOX Mixnet Node - Docker Compose
# Docs: https://github.com/hisoka-io/run-nox
#
# Quick start:
#   1. cp configs/arbitrum-sepolia.deployment.json deployment.json
#   2. Export NOX_IMAGE and NOX_PREFLIGHT_IMAGE from its "release" object.
#   3. docker run --rm "$NOX_IMAGE" nox keygen > .env
#   4. cp configs/relay.toml config.toml   # or configs/exit.toml
#   5. Exit only: echo 'COMPOSE_PROFILES=exit' >> .env   (adds the price server)
#   6. docker compose up -d
#
# Optional KPS entry (README "KPS Entry"): the "kps" profile runs nox-kps (UDP
# 15005, WebRTC + QUIC) as its own container from the same NOX_IMAGE as the
# node. It needs nox-kps.toml and a release record with release.noxKps; with
# the profile off, Compose starts only the services above.

services:
  preflight:
    image: ${NOX_PREFLIGHT_IMAGE:?NOX_PREFLIGHT_IMAGE must be the immutable preflight digest in deployment.json}
    container_name: nox-preflight
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    network_mode: host
    volumes:
      - type: bind
        source: ./config.toml
        target: /etc/nox/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deployment.json
        target: /etc/nox-release/deployment.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/preflight_config.py
        target: /opt/nox/preflight_config.py
        read_only: true
        bind:
          create_host_path: false
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    entrypoint: ["python3", "/opt/nox/preflight_config.py"]
    command:
      - auto
      - /etc/nox/config.toml
      - /etc/nox-release/deployment.json
      - ${NOX_IMAGE:?NOX_IMAGE must be the immutable Nox digest in deployment.json}
      - ${NOX_PREFLIGHT_IMAGE:?NOX_PREFLIGHT_IMAGE must be the immutable preflight digest in deployment.json}
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Exit nodes only. Relays never query prices (oracle_url = ""), so the price
  # server runs only under the "exit" profile.
  price-server:
    image: ${NOX_IMAGE:?NOX_IMAGE must be an immutable ghcr.io/hisoka-io/nox digest}
    container_name: nox-price-server
    profiles: ["exit"]
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["price_server"]
    environment:
      - PRICE_SERVER_PORT=15004
      - PRICE_SERVER_BIND=127.0.0.1
      - RUST_LOG=info
    network_mode: host
    depends_on:
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:15004/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nox:
    image: ${NOX_IMAGE:?NOX_IMAGE must be an immutable ghcr.io/hisoka-io/nox digest}
    container_name: nox-node
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    network_mode: host
    volumes:
      - type: bind
        source: ./config.toml
        target: /etc/nox/config.toml
        read_only: true
        bind:
          create_host_path: false
      - nox-identity:/var/lib/nox/identity
      - nox-data:/var/lib/nox/data
      - nox-logs:/var/lib/nox/logs
    env_file:
      - .env
    environment:
      - RUST_LOG=info
      - NOX_LOG_DIR=/var/lib/nox/logs
    depends_on:
      preflight:
        condition: service_completed_successfully
      # Start after the price server when the exit profile is active, but do
      # not wait for a fresh price: a price-API outage must not keep the node
      # off the mixnet. Relays run without the price server.
      price-server:
        condition: service_started
        required: false
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:15001/topology"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- Optional KPS entry (profile "kps") ---------------------------------
  # Checks nox-kps.toml against config.toml and the release record before the
  # sidecar starts: an image that ships nox-kps, public IP, loopback upstreams on
  # the enabled ingress/topology ports, the shared client IP header, and that UDP
  # 15005 is free (or held by nox-kps itself).
  nox-kps-preflight:
    image: ${NOX_PREFLIGHT_IMAGE:?NOX_PREFLIGHT_IMAGE must be the immutable preflight digest in deployment.json}
    container_name: nox-kps-preflight
    profiles: ["kps"]
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    network_mode: host
    volumes:
      - type: bind
        source: ./nox-kps.toml
        target: /etc/nox-kps/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config.toml
        target: /etc/nox/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deployment.json
        target: /etc/nox-release/deployment.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/preflight_kps.py
        target: /opt/nox/preflight_kps.py
        read_only: true
        bind:
          create_host_path: false
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    entrypoint: ["python3", "/opt/nox/preflight_kps.py"]
    command:
      - /etc/nox-kps/config.toml
      - /etc/nox/config.toml
      - /etc/nox-release/deployment.json
      - ${NOX_IMAGE:?NOX_IMAGE must be the immutable Nox digest in deployment.json}
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Gives the nox-kps volumes to the nox-kps UID 10002 (idempotent). Shares the
  # kps-admin profile so one-off nox-kps-admin commands run it first.
  nox-kps-init:
    image: ${NOX_IMAGE:?NOX_IMAGE must be an immutable ghcr.io/hisoka-io/nox digest}
    container_name: nox-kps-init
    profiles: ["kps", "kps-admin"]
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_READ_SEARCH"]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    entrypoint: ["chown", "-R", "10002:10002", "/var/lib/nox-kps", "/var/lib/nox-kps-bundles"]
    volumes:
      - nox-kps-identity:/var/lib/nox-kps
      - nox-kps-bundles:/var/lib/nox-kps-bundles
    restart: "no"

  # KPS entry: browsers (WebRTC) and native clients (QUIC) dial
  # <public ip>:15005:<certhash>; each allowlisted request is proxied to the
  # node's loopback ingress and topology API. The nox-kps binary ships in the
  # node image (same digest as the nox service) and runs here as its own
  # process with its own UID, memory limit and restarts. The identity key
  # (certhash = published address) lives in nox-kps-identity: back it up and
  # keep the volume. `nox-kps run` serves only the identity whose certhash is
  # expected_certhash in nox-kps.toml (README "KPS Entry").
  nox-kps:
    image: ${NOX_IMAGE:?NOX_IMAGE must be an immutable ghcr.io/hisoka-io/nox digest}
    container_name: nox-kps
    profiles: ["kps"]
    user: "10002:10002"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # Host networking: UDP 15005 on the host, and loopback upstreams, which is
    # where the node trusts the client IP header.
    network_mode: host
    tmpfs:
      - /tmp:size=16m,mode=1777
    entrypoint: ["nox-kps"]
    command: ["run"]
    environment:
      - NOX_KPS_CONFIG=/etc/nox-kps/config.toml
    volumes:
      - type: bind
        source: ./nox-kps.toml
        target: /etc/nox-kps/config.toml
        read_only: true
        bind:
          create_host_path: false
      - nox-kps-identity:/var/lib/nox-kps
      - nox-kps-bundles:/var/lib/nox-kps/keccak:ro
    depends_on:
      nox-kps-preflight:
        condition: service_completed_successfully
      nox-kps-init:
        condition: service_completed_successfully
      nox:
        condition: service_started
    restart: unless-stopped
    # nox-kps [shutdown] grace_period_ms (10 s) + close_linger_ms (2 s) fit inside it.
    stop_grace_period: 15s
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "nox-kps", "healthcheck"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 10s

  # One-off nox-kps commands with the same image, UID, config and volumes,
  # networking turned off, and the bundle volume writable:
  #   docker compose run --rm nox-kps-admin init
  #   docker compose run --rm nox-kps-admin address
  #   docker compose run --rm nox-kps-admin check-config
  #   docker compose run --rm -v "$PWD/<file>:/in/<file>:ro" nox-kps-admin bundle add /in/<file>
  nox-kps-admin:
    image: ${NOX_IMAGE:?NOX_IMAGE must be an immutable ghcr.io/hisoka-io/nox digest}
    profiles: ["kps-admin"]
    user: "10002:10002"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    tmpfs:
      - /tmp:size=16m,mode=1777
    entrypoint: ["nox-kps"]
    command: ["check-config"]
    environment:
      - NOX_KPS_CONFIG=/etc/nox-kps/config.toml
    volumes:
      - type: bind
        source: ./nox-kps.toml
        target: /etc/nox-kps/config.toml
        read_only: true
        bind:
          create_host_path: false
      - nox-kps-identity:/var/lib/nox-kps
      - nox-kps-bundles:/var/lib/nox-kps/keccak
    depends_on:
      nox-kps-init:
        condition: service_completed_successfully
    restart: "no"

volumes:
  nox-identity:
  nox-data:
  nox-logs:
  nox-kps-identity:
  nox-kps-bundles:
