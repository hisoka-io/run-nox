# NOX Mixnet Node - Docker Compose
# Docs: https://github.com/hisoka-io/run-nox
#
# Quick start:
#   1. Export NOX_IMAGE and NOX_PREFLIGHT_IMAGE from the signed release record.
#   2. Copy the signed deployment record to ./deployment.json.
#   3. docker run --rm "$NOX_IMAGE" keygen > .env
#   4. cp configs/relay.toml config.toml   # or configs/exit.toml
#   5. docker compose up -d

services:
  preflight:
    image: ${NOX_PREFLIGHT_IMAGE:?NOX_PREFLIGHT_IMAGE must be the immutable preflight digest in deployment.json}
    container_name: nox-preflight
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    network_mode: host
    volumes:
      - type: bind
        source: ./config.toml
        target: /etc/nox/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deployment.json
        target: /etc/nox-release/deployment.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/preflight_config.py
        target: /opt/nox/preflight_config.py
        read_only: true
        bind:
          create_host_path: false
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    entrypoint: ["python3", "/opt/nox/preflight_config.py"]
    command:
      - auto
      - /etc/nox/config.toml
      - /etc/nox-release/deployment.json
      - ${NOX_IMAGE:?NOX_IMAGE must be the immutable Nox digest in deployment.json}
      - ${NOX_PREFLIGHT_IMAGE:?NOX_PREFLIGHT_IMAGE must be the immutable preflight digest in deployment.json}
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  price-server:
    image: ${NOX_IMAGE:?NOX_IMAGE must be an immutable ghcr.io/hisoka-io/nox digest}
    container_name: nox-price-server
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["price_server"]
    environment:
      - PRICE_SERVER_PORT=15004
      - PRICE_SERVER_BIND=0.0.0.0
      - RUST_LOG=info
    network_mode: host
    depends_on:
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:15004/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nox:
    image: ${NOX_IMAGE:?NOX_IMAGE must be an immutable ghcr.io/hisoka-io/nox digest}
    container_name: nox-node
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    network_mode: host
    volumes:
      - type: bind
        source: ./config.toml
        target: /etc/nox/config.toml
        read_only: true
        bind:
          create_host_path: false
      - nox-identity:/var/lib/nox/identity
      - nox-data:/var/lib/nox/data
      - nox-logs:/var/lib/nox/logs
    env_file:
      - .env
    environment:
      - RUST_LOG=info
      - NOX_LOG_DIR=/var/lib/nox/logs
    depends_on:
      preflight:
        condition: service_completed_successfully
      price-server:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:15001/topology"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  nox-identity:
  nox-data:
  nox-logs:
